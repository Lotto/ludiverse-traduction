      description: "Viva Catrina est un jeu célébrant la tradition mexicaine du Día de los Muertos. La traduction a nécessité une attention particulière aux références culturelles pour préserver l'authenticité de cette célébration tout en la rendant accessible au public international."
      testimonial: "Une traduction respectueuse qui a su conserver l'esprit festif et culturel du jeu original."

